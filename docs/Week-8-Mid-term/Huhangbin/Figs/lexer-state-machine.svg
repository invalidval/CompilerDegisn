<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lexer state machine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f9ff"/>
      <stop offset="100%" stop-color="#e8f2ff"/>
    </linearGradient>
    <linearGradient id="nodeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#edf5ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0a3d8f" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0b63d0"/>
    </marker>
    <style>
      .title { font: 700 40px 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #123b78; }
      .sub { font: 500 18px 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #2a5b9b; }
      .state-title { font: 700 24px 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #0b3f86; }
      .state-desc { font: 500 16px 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #325f9a; }
      .edge { stroke: #0b63d0; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .edge-dashed { stroke: #4a7fcf; stroke-width: 3; stroke-dasharray: 10 8; fill: none; marker-end: url(#arrow); }
      .label { font: 600 16px 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #0b4fa8; }
      .badge { font: 700 14px 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #ffffff; }
      .legend { font: 500 15px 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #29558f; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="900" fill="url(#bg)"/>
  <rect x="26" y="26" width="1348" height="848" rx="26" fill="none" stroke="#9ec2f4" stroke-width="3"/>

  <text class="title" x="70" y="95">词法分析状态机（Lexer FSM）</text>
  <text class="sub" x="70" y="130">INITIAL 为主状态，COMMENT 与 DIRECTIVE 为扩展状态；EOF 统一做未闭合校验</text>

  <circle cx="120" cy="300" r="34" fill="#0b63d0" filter="url(#shadow)"/>
  <text class="badge" x="108" y="306">START</text>

  <g filter="url(#shadow)">
    <rect x="270" y="220" width="300" height="190" rx="20" fill="url(#nodeFill)" stroke="#0b63d0" stroke-width="4"/>
    <text class="state-title" x="360" y="270">INITIAL</text>
    <text class="state-desc" x="300" y="305">识别关键词、标识符、数字</text>
    <text class="state-desc" x="300" y="332">运算符与分隔符</text>
    <text class="state-desc" x="300" y="359">记录 token 起始行列</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="740" y="150" width="320" height="180" rx="20" fill="url(#nodeFill)" stroke="#0b63d0" stroke-width="4"/>
    <text class="state-title" x="845" y="198">COMMENT</text>
    <text class="state-desc" x="772" y="232">进入条件：遇到 {</text>
    <text class="state-desc" x="772" y="259">支持嵌套：depth++ / depth--</text>
    <text class="state-desc" x="772" y="286">depth=0 返回 INITIAL</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="740" y="430" width="320" height="190" rx="20" fill="url(#nodeFill)" stroke="#0b63d0" stroke-width="4"/>
    <text class="state-title" x="820" y="480">DIRECTIVE</text>
    <text class="state-desc" x="772" y="515">进入条件：遇到 {$</text>
    <text class="state-desc" x="772" y="542">累计指令体并校验白名单</text>
    <text class="state-desc" x="772" y="569">遇到 } 后返回 INITIAL</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1120" y="270" width="200" height="140" rx="20" fill="url(#nodeFill)" stroke="#0b63d0" stroke-width="4"/>
    <text class="state-title" x="1188" y="318">EOF</text>
    <text class="state-desc" x="1145" y="352">未闭合注释/指令</text>
    <text class="state-desc" x="1162" y="378">统一报错</text>
  </g>

  <path class="edge" d="M154 300 C 200 300, 225 300, 270 300"/>
  <text class="label" x="182" y="282">初始化</text>

  <path class="edge" d="M570 255 C 650 220, 670 205, 740 205"/>
  <text class="label" x="620" y="215">{</text>

  <path class="edge" d="M570 350 C 650 430, 670 510, 740 510"/>
  <text class="label" x="620" y="430">{$</text>

  <path class="edge" d="M1060 230 C 1110 230, 1110 305, 1120 305"/>
  <text class="label" x="1085" y="268">EOF</text>

  <path class="edge" d="M1060 560 C 1120 560, 1120 390, 1120 390"/>
  <text class="label" x="1088" y="505">EOF</text>

  <path class="edge-dashed" d="M900 330 C 900 380, 900 390, 900 430"/>
  <text class="label" x="920" y="385">注释结束后可继续扫描</text>

  <path class="edge-dashed" d="M740 300 C 680 300, 640 300, 570 300"/>
  <text class="label" x="630" y="335">depth==0</text>

  <path class="edge-dashed" d="M740 525 C 680 525, 640 365, 570 365"/>
  <text class="label" x="620" y="470">} + 校验通过/失败</text>

  <rect x="70" y="700" width="1260" height="130" rx="16" fill="#ffffff" stroke="#b7d3f8" stroke-width="2"/>
  <circle cx="106" cy="744" r="9" fill="#0b63d0"/>
  <text class="legend" x="128" y="749">位置统计：通过 YY_USER_ACTION 在所有状态持续推进行列号。</text>
  <circle cx="106" cy="780" r="9" fill="#2f7be0"/>
  <text class="legend" x="128" y="785">错误策略：非法字符最小前进继续扫描；未闭合结构在 EOF 汇总上报。</text>
  <circle cx="106" cy="816" r="9" fill="#5b98ea"/>
  <text class="legend" x="128" y="821">可观测性：--dump-tokens 提供 Rule、token 计数和耗时，支持调试与回归分析。</text>
</svg>
